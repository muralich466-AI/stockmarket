name: Daily 9:15 AM EST Job with Email

on:
  schedule:
    - cron: "*/5 * * * *"   # 9:15 AM EST (14:15 UTC)
  workflow_dispatch:

jobs:
  daily-task:
    runs-on: ubuntu-latest

   -steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas
      - name: Run stock analysis script
        run: |
          # Runs the script, prints to GitHub console, AND saves to stock_report.txt
          python dailycheckCalloption.py 2>&1 | tee stock_report.txt

      - name: Send email with output
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Daily GitHub Action Report - 9:15 AM EST"
          to: "muralich466@gmail.com"
          from: "GitHub Actions <muralich466@gmail.com>"
                    
          body: file://stock_report.txt
                Hello Murali
                  Your daily GitHub Action ran successfully at 9:15 AM EST.
                  Please find the output attached.
          attachments: stock_report.txt
