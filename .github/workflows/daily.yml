name: Daily 9:15 AM EST Job with Email

on:
  schedule:
    - cron: "*/5 * * * *"   # 9:15 AM EST (14:15 UTC)
  workflow_dispatch:

jobs:
  daily-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run daily script
        id: runscript
        run: |
          echo "Daily workflow executed at 9:15 AM EST" > output.txt
          echo "Some more logs..." >> output.txt

      - name: Send email with output
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Daily GitHub Action Report - 9:15 AM EST"
          to: "muralich466@gmail.com"
          from: "GitHub Actions <muralich466@gmail.com>"
                    
          body: file://stock_report.txt
                Hello Murali
                  Your daily GitHub Action ran successfully at 9:15 AM EST.
                  Please find the output attached.
          attachments: stock_report.txt
